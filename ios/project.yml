name: KalendarSync
options:
  bundleIdPrefix: com.dendaime
  deploymentTarget:
    iOS: "16.0"

targets:
  KalendarSync:
    type: application
    platform: iOS
    sources:
      - path: KalendarSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dendaime.kalendar.ios
        INFOPLIST_KEY_CFBundleDisplayName: Kalendar Sync
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Kalendar Sync necesita leer tus calendarios para enviarlos a tu Huawei Watch Fit 3."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Kalendar Sync necesita acceso a tus calendarios (iCloud, Google, Outlook) para mostrarlos en tu Huawei Watch Fit 3."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Kalendar Sync usa Bluetooth para sincronizar tus eventos con tu Huawei Watch Fit 3."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
